name: Windows MSVC modular

on:
  pull_request:
  workflow_dispatch:

jobs:
  bazi-module-link:
    name: BaZi module links against the base module
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build modular DLLs
        run: cmake --build --preset windows-msvc --target taiyin taiyin_bazi
      - name: Build and run BaZi C API integration test
        run: |
          cmake --build --preset windows-msvc --target test_bazi_c_api
          ctest --test-dir build-preset-windows-msvc -C Release --output-on-failure -R "^bazi_c_api$"
