name: Windows MSVC modular

on:
  pull_request:
  workflow_dispatch:

jobs:
  modular-extension-link:
    name: BaZi and Ziwei modules link against the base module
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build modular DLLs
        run: cmake --build --preset windows-msvc --target taiyin taiyin_bazi taiyin_ziwei
      - name: Build and run modular C API integration tests
        run: |
          cmake --build --preset windows-msvc --target test_bazi_c_api test_ziwei_c_api test_mapped_file
          ctest --test-dir build-preset-windows-msvc -C Release --output-on-failure -R "^(bazi|ziwei)_c_api$|^mapped_file$"
